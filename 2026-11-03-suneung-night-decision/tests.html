<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판정 테스트 — 수능 끝난 밤 결정표</title><meta name="robots" content="noindex"><link rel="stylesheet" href="styles.css"></head><body><main id="view"><h1>판정 테스트 (손계산 대조)</h1><p id="sum">실행 중…</p><div class="tbl-wrap"><table><thead><tr><th scope="col">케이스</th><th scope="col">기대</th><th scope="col">결과</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script src="rules.js"></script><script src="selftest.js"></script><script>var r=runSelfTest(SND);document.getElementById('rows').innerHTML=r.cases.map(function(c){return'<tr><td>'+c.name+'</td><td>'+c.want+'</td><td>'+(c.ok?'✓ ':'✕ ')+c.got+'</td></tr>'}).join('');document.getElementById('sum').textContent=r.pass+'/'+r.total+' 통과';document.title=(r.pass===r.total?'통과 ':'실패 ')+'판정 테스트 — 수능 끝난 밤 결정표'</script></body></html>
